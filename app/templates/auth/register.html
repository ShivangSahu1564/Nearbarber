{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<section class="form-section container"><div class="form-panel"><p class="eyebrow">Join the neighborhood</p><h1>Create your account</h1><p class="muted">One account for a better-planned visit.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">Your name</label><input class="form-control" id="name" name="name" autocomplete="name" required maxlength="120"></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required maxlength="255"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required><div class="form-text">Use at least 8 characters.</div></div><div class="mb-3"><label class="form-label" for="role">I’m joining as</label><select id="role" name="role" class="form-select"><option value="customer">Customer</option><option value="owner">Shop owner</option></select></div><button class="btn btn-gold w-100 mt-2">Create account</button></form><p class="form-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></section>{% endblock %}
