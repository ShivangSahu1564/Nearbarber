{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<section class="form-section container"><div class="form-panel"><p class="eyebrow">Welcome back</p><h1>Sign in</h1><p class="muted">Pick up where your next good cut begins.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ request.args.get('next','') }}"><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required maxlength="255"></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div><button class="btn btn-gold w-100 mt-2">Sign in</button></form><p class="form-foot">New to NearBarber? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></section>{% endblock %}
