{% extends 'base.html' %}{% block title %}{{ 'Edit service' if service else 'Add service' }}{% endblock %}{% block content %}<section class="form-section container"><div class="form-panel"><a class="back-link" href="{{ url_for('owner.shop_detail', shop_id=shop.id) }}">← {{ shop.name }}</a><p class="eyebrow mt-4">Shop services</p><h1>{{ 'Edit service' if service else 'Add a service' }}</h1><form method="post" class="mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">Service name</label><input class="form-control" id="name" name="name" required maxlength="120" value="{{ service.name if service else '' }}"></div><div class="mb-3"><label class="form-label" for="price">Price (₹)</label><input class="form-control" id="price" name="price" type="number" min="0" step="0.01" required value="{{ service.price if service else '' }}"></div><div class="mb-3"><label class="form-label" for="duration_minutes">Duration (minutes)</label><input class="form-control" id="duration_minutes" name="duration_minutes" type="number" min="1" max="480" required value="{{ service.duration_minutes if service else '' }}"></div><button class="btn btn-gold w-100">{{ 'Save changes' if service else 'Add service' }}</button></form></div></section>{% endblock %}
